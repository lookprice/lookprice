    <circle cx="218" cy="132" r="16" fill="#ffffff" stroke="#059669" stroke-width="8" />
  </g>
  <!-- Text 'Enrakipsiz' -->
  <text x="160" y="170" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#1e293b" letter-spacing="-1">Enrakipsiz</text>
