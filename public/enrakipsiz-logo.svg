    <!-- House roof & chimney outline -->
    <path d="M 32 78 L 72 38 L 112 78" />
    <path d="M 46 64 V 44 H 56 V 54" />
    <!-- Car body contour merging smoothly -->
    <path d="M 72 38 C 110 38 125 78 155 78 L 220 78 C 248 78 268 90 272 108 C 274 122 265 132 248 132 L 40 132 C 30 132 25 122 25 108 C 25 90 40 78 72 38 Z" />
    <!-- Car wheels cutouts -->
