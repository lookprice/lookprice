      <!-- Dynamic Speed Swoosh -->
      <path d="M 0 62 Q 45 46 115 45 Q 155 45 182 60" stroke="#059669" stroke-width="6" stroke-linecap="round" fill="none" />
      <!-- Front & Rear Wheels -->
      <circle cx="45" cy="74" r="16" fill="#0f172a" stroke="#ffffff" stroke-width="3" />
      <circle cx="45" cy="74" r="7" fill="#e2e8f0" />
      <circle cx="138" cy="74" r="16" fill="#0f172a" stroke="#ffffff" stroke-width="3" />
      <circle cx="138" cy="74" r="7" fill="#e2e8f0" />
    </g>
  </g>

  <!-- Brand Typography 'Enrakipsiz' -->
  <text x="205" y="96" font-family="'Inter', 'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="76" fill="#059669" letter-spacing="-2">Enrakipsiz</text>
