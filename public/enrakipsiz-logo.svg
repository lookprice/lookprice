    <path d="M 20 62 L 78 12 L 136 62 H 118 V 70 H 38 V 62 Z" fill="#2d3748" />
    <rect x="98" y="20" width="13" height="24" fill="#2d3748" rx="2" />
    
    <!-- Sports Car Silhouette -->
    <g transform="translate(0, 26)">
      <!-- Car Roof / Body -->
      <path d="M 5 62 C 12 44 32 34 56 31 C 80 28 108 28 132 33 C 150 37 165 44 172 54 C 176 60 178 66 178 70 C 178 74 170 76 155 76 L 15 76 C 5 76 2 70 5 62 Z" fill="#1a202c" />
      <!-- Window Cutout -->
